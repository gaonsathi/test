<!DOCTYPE html>
<!--
  ======================================================================
  योजना विवरण पेज (Scheme Article Page) — SECTION-ONLY FILE
  ======================================================================
  This is a STANDALONE page (not injected into index.html's SPA like
  the other sections) — same as how a normal "read more" page works.
  It is opened as: yojna/article.html?slug=SOME-SLUG

  Content is NOT hardcoded here. It is fetched from the admin-controlled
  API (server/server.js → GET /api/schemes/:slug) and rendered by
  article.js. Admins add/edit schemes from admin/admin.html — no code
  changes needed to publish a new scheme article.

  Needs the small Gaon Sathi server running (see server/README / the
  note in server/server.js) so /api/schemes/:slug is reachable. If the
  server isn't running, this page shows a friendly "couldn't load"
  message instead of breaking.
  ======================================================================
-->

  </div>
  <div class="nav-overlay" id="navOverlay"></div>
