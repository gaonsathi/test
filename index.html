  <p class="eng">Made with ❤️ for Rural India</p>

<!-- ===== SECTION LOADER =====
     Every section lives in its own top-level folder: home/, kisan/,
     kaam/, pashu/, yojna/, community/ — one folder per person/section,
     no nested subfolders inside them.
     Add a new section? ->
       1. create yourSection/yourSection.html
       2. add its path to SECTION_FILES below (controls order on page)
       3. if it needs its own CSS/JS, put them in the SAME folder
          (e.g. yourSection/yourSection.css, yourSection/yourSection.js)
          and add a <link> in <head> + an entry in the scripts list,
          same as the kaam/ example below.
     No other file needs to change. ===== -->
<script>
  // Base URL of the deployed backend (Render). Used by crop.js, rate.js,
  // yojna.js, etc. to reach /api/... routes instead of localhost.
  window.GAON_SATHI_API_BASE = "https://test-qgnn.onrender.com";
</script>

<script>
  const SECTION_FILES = [
    'home/home.html',
    'kisan/kisan.html',
    'kaam/kaam.html',
    'pashu/pashu.html',
    'yojna/yojna.html',
    'community/community.html'

  ];

  // Each section is fetched independently. If one file is missing/broken
  // (typo'd path, teammate hasn't pushed it yet, 404, etc.) that section
  // alone shows a small inline notice in its own spot — every other
  // section still loads and the app scripts still run normally.
  Promise.allSettled(
    SECTION_FILES.map(file => fetch(file).then(r => {
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }))
  ).then(results => {
    const htmlParts = results.map((result, i) => {
      if(result.status === 'fulfilled') return result.value;
      console.error('Section failed to load:', SECTION_FILES[i], result.reason);
      return '<section style="padding:40px;text-align:center;color:#C1440E;">'
        + 'यह सेक्शन लोड नहीं हो पाया: ' + SECTION_FILES[i] + '</section>';
    });
    document.getElementById('mainContent').innerHTML = htmlParts.join('\n');

    // Load app logic now that every available section is in the DOM.
    // Shared script first, then each section-only script. Section
    // scripts guard themselves (see kisan.js / kaam.js) so a missing
    // section's script simply does nothing instead of erroring.
    // (A new section-only script? Just add its path to this list.
    //  ⚠️ Do not write #kaam logic here — it belongs in kaam/kaam.js)
    const scripts = ['js/script.js', 'kisan/kisan.js', 'kisan/weather/weather.js', 'kaam/kaam.js', 'pashu/pashu.js', 'yojna/yojna.js', 'community/community.js', 'js/fx.js'];
    scripts.forEach(src => {
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => console.error('Script failed to load:', src);
      document.body.appendChild(s);
    });
  });
</script>

</body>
</html>
